[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-queue-service"
version = "0.1.0"
description = "A small Flask webhook receiver with a SQLite-backed queue"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["webhook_service*"]
